name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE', '.github/assets/**', '.github/ISSUE_TEMPLATE/**',
                   'action.yml', '.github/workflows/action-test.yml', '.github/workflows/sync.yml']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE', '.github/assets/**', '.github/ISSUE_TEMPLATE/**',
                   'action.yml', '.github/workflows/action-test.yml', '.github/workflows/sync.yml']
  schedule:
    - cron: '23 4 * * 1' # weekly rebuild picks up Debian security updates
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/lifeboat/postgresql

jobs:
  build:
    name: postgresql ${{ matrix.version }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        version: ['18', '17', '16']
        arch: [amd64, arm64]
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
          # The Bitnami chart line made for each major. Bitnami still releases 18 only, so 18 is the
          # one major whose image must match Bitnami's current one exactly; 17 and 16 are newer point
          # releases than Bitnami's last public builds, so their comparison is informational.
          - { version: '18', chart: 18.12.4, exact_parity: true }
          - { version: '17', chart: 16.7.27, exact_parity: false }
          - { version: '16', chart: 15.5.38, exact_parity: false }
    env:
      IMAGE_DIR: images/postgresql/${{ matrix.version }}/debian-12
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Runner CPU
        run: |
          grep -m1 -E 'model name|^CPU part' /proc/cpuinfo || true
          for f in avx2 fma avx512f fphp asimdhp; do grep -qw "$f" /proc/cpuinfo && printf '%s ' "$f"; done; echo

      # The build cache lives in GHCR: the compiler stages of several images outgrow the 10 GB
      # Actions cache. Every major also reads 18's cache, since the GEOS, PROJ, GDAL and protobuf
      # stages are the same. Pull requests read it anonymously and skip writing it.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build from upstream source
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.IMAGE_DIR }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: lifeboat/postgresql:ci
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME }}-cache:${{ matrix.version }}-${{ matrix.arch }}
            type=registry,ref=${{ env.IMAGE_NAME }}-cache:18-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}-cache:{1}-{2},mode=max,ignore-error=true', env.IMAGE_NAME, matrix.version, matrix.arch) || '' }}

      - name: pgvector runs on older CPUs
        run: bash scripts/cpu-compat.sh lifeboat/postgresql:ci

      - name: Behavior (env vars, init scripts, extensions, nss_wrapper, replication)
        run: bash scripts/smoke-postgresql.sh lifeboat/postgresql:ci | tee candidate.transcript

      - name: Start a kind cluster
        if: matrix.arch == 'amd64'
        uses: helm/kind-action@v1.15.0
        with:
          cluster_name: chart

      - name: Bitnami's Helm chart runs this image (primary and read replica)
        if: matrix.arch == 'amd64'
        env:
          CHART_VERSION: ${{ matrix.chart }}
        run: bash scripts/chart-test.sh lifeboat/postgresql:ci chart

      - name: Build Bitnami's image as the reference
        id: reference
        continue-on-error: true # needs downloads.bitnami.com, which Broadcom can close at any time
        run: bash scripts/build-reference.sh "$IMAGE_DIR" bitnami-reference/postgresql:ci

      - name: Parity with Bitnami's image
        if: steps.reference.outcome == 'success'
        env:
          EXACT: ${{ matrix.exact_parity }}
        run: |
          bash scripts/parity.sh bitnami-reference/postgresql:ci lifeboat/postgresql:ci parity
          bash scripts/smoke-postgresql.sh bitnami-reference/postgresql:ci > reference.transcript || true
          { echo; echo '## Behavior diff'; echo '```diff'; diff -u reference.transcript candidate.transcript || true; echo '```'; } >> parity/report.md
          cat parity/report.md >> "$GITHUB_STEP_SUMMARY"
          # Same scripts from the same upstream commit, so once Bitnami's image passes its own run,
          # any difference is a regression here. When it doesn't (its pgvector needs AVX-512, which
          # many runners lack), or when lifeboat ships a newer point release, the diff is reported.
          if [[ "$EXACT" != true ]]; then
            echo "::notice::$IMAGE_DIR is newer than Bitnami's last public build of this major; the diff is informational."
          elif grep -qx 'failures: 0' reference.transcript; then
            diff -q reference.transcript candidate.transcript
          else
            echo "::warning::Bitnami's image failed its own behavior checks on this runner ($(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)); see the report."
          fi

      - name: What a scanner sees (Trivy)
        if: steps.reference.outcome == 'success'
        continue-on-error: true
        run: |
          for side in reference candidate; do
            image=bitnami-reference/postgresql:ci
            [[ $side == candidate ]] && image=lifeboat/postgresql:ci
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 image --quiet \
              --scanners vuln --pkg-types library --list-all-pkgs --format json "$image" \
              | jq -r '.Results[]? | select(.Type == "bitnami") | .Packages[]? | "\(.Name) \(.Version)"' | sort > "trivy-$side.txt"
          done
          { echo; echo "## Components Trivy finds ($(wc -l < trivy-reference.txt) in Bitnami's, $(wc -l < trivy-candidate.txt) in lifeboat's)"
            echo '```diff'; diff -u trivy-reference.txt trivy-candidate.txt || true; echo '```'; } | tee -a parity/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-${{ matrix.version }}-${{ matrix.arch }}
          path: |
            parity/report.md
            *.transcript
            trivy-*.txt
          if-no-files-found: ignore

      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.IMAGE_DIR }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME }}-cache:${{ matrix.version }}-${{ matrix.arch }}
            type=registry,ref=${{ env.IMAGE_NAME }}-cache:18-${{ matrix.arch }}

      - name: Export digest
        if: steps.push.outcome == 'success'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        if: steps.push.outcome == 'success'
        with:
          name: digest-${{ matrix.version }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    name: publish postgresql ${{ matrix.version }}
    needs: build
    # Each major publishes once both of its architectures built, even if another major failed.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: '18', newest: true }
          - { version: '17', newest: false }
          - { version: '16', newest: false }
    env:
      IMAGE_DIR: images/postgresql/${{ matrix.version }}/debian-12
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: digest-${{ matrix.version }}-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-arch image
        id: tags
        env:
          NEWEST: ${{ matrix.newest }}
        run: |
          if [[ "$(ls digests 2>/dev/null | wc -l)" -lt 2 ]]; then
            echo "::warning::postgresql ${{ matrix.version }} did not build on both architectures; nothing published."
            exit 0
          fi
          version="$(sed -n 's/^ARG POSTGRESQL_VERSION=//p' "$IMAGE_DIR/Dockerfile")"
          tags=("$version.0" "$version" "${version%%.*}")
          # Only the newest major tracks Bitnami's current release, so only it carries Bitnami's
          # revision tag, and latest.
          if [[ "$NEWEST" == true ]]; then
            revision="$(sed -n 's/^ARG IMAGE_REVISION=//p' "$IMAGE_DIR/Dockerfile")"
            tags+=("$version.0-debian-12-r$revision" latest)
          fi
          args=()
          for t in "${tags[@]}"; do args+=(-t "$IMAGE_NAME:$t"); done
          docker buildx imagetools create "${args[@]}" $(printf "$IMAGE_NAME@sha256:%s " $(ls digests))
          digest="$(docker buildx imagetools inspect "$IMAGE_NAME:$version.0" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: steps.tags.outputs.digest != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.tags.outputs.digest }}
          push-to-registry: true
